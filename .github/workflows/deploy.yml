# =============================================================================
# GitHub Actions : à chaque push sur main
#   1. construit l'image Docker et vérifie qu'elle répond (/healthz) ;
#   2. si le test passe, envoie le dossier src/ sur l'hébergement OVH (www/) par FTP chiffré.
#      Les fichiers supprimés du dépôt sont aussi supprimés en ligne.
# Secrets à définir : Settings → Secrets and variables → Actions → New repository secret
#   FTP_HOST (ex. ftp.cluster0XX.hosting.ovh.net), FTP_USER, FTP_PASSWORD
# Variable facultative (onglet « Variables ») : FTP_DIR (www par défaut)
# =============================================================================
name: Tester et mettre en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:          # bouton « Run workflow » pour relancer à la main

permissions:
  contents: read

concurrency:                  # jamais deux mises en ligne en même temps
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Construire et tester l'image Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Construire l'image
        run: docker build -t portfolio:test .
      - name: Test de fumée (le site démarre et répond)
        run: |
          docker run -d --name smoke -p 8080:8080 portfolio:test
          for i in $(seq 1 15); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          curl -fs http://localhost:8080/ | grep -q "Thomas Jondeau"
          docker rm -f smoke

  deploy:
    name: Mettre en ligne sur OVH
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://thomas-jondeau.fr
    steps:
      - uses: actions/checkout@v5
      - name: Installer lftp
        run: sudo apt-get update -q && sudo apt-get install -y -q lftp
      - name: Envoyer src/ dans www/
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || 'www' }}
        run: |
          # secrets présents ?
          for v in FTP_HOST FTP_USER FTP_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Le secret $v est vide ou absent"; exit 1; }
          done
          # nom du serveur nettoyé (sans ftp:// ni espaces ni / final)
          HOST=$(echo "$FTP_HOST" | sed -e 's#^ftps\?://##' -e 's#/*$##' | tr -d '[:space:]')
          MIRROR="mirror --reverse --delete --verbose src/ $FTP_DIR/"
          send() {   # $1 = réglages lftp ; le reste = description
            echo "::group::Tentative : $2"
            lftp -u "$FTP_USER","$FTP_PASSWORD" -e "set net:timeout 20; set net:max-retries 2; $1; $MIRROR; bye" "$HOST"
            local rc=$?; echo "::endgroup::"; return $rc
          }
          # 1. FTP chiffré avec vérification du certificat
          send "set ftp:ssl-force true; set ssl:verify-certificate yes" "FTP chiffré (certificat vérifié)" && exit 0
          # 2. FTP chiffré sans vérification du nom du certificat (le certificat OVH ne porte pas toujours le nom du cluster)
          send "set ftp:ssl-force true; set ssl:verify-certificate no" "FTP chiffré (certificat non vérifié)" && exit 0
          # 3. FTP simple, si l'hébergement n'accepte pas le chiffrement
          echo "::warning::Le chiffrement FTP est refusé par l'hébergeur : envoi en FTP simple"
          send "set ftp:ssl-allow false" "FTP simple" && exit 0
          echo "::error::Connexion FTP impossible : vérifier FTP_HOST (ex. ftp.cluster0XX.hosting.ovh.net), FTP_USER et FTP_PASSWORD"
          exit 1
      - name: Vérifier que le site répond
        # n'échoue pas la mise en ligne : le certificat HTTPS d'OVH peut mettre quelques heures à s'activer
        continue-on-error: true
        run: |
          curl -fsI https://thomas-jondeau.fr/ | head -n 1 || {
            echo "::warning::https://thomas-jondeau.fr ne répond pas encore en HTTPS (certificat SSL OVH pas encore actif ?)"
            curl -sI http://thomas-jondeau.fr/ | head -n 1
            exit 1; }
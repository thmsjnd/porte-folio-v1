# =============================================================================
# Nginx — configuration du portfolio (image non root, écoute sur 8080)
# =============================================================================
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas exposer la version de Nginx
    server_tokens off;

    # ---------- Compression ----------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- En-têtes de sécurité (fichier commun) ----------
    include /etc/nginx/snippets/security-headers.conf;

    # ---------- Fichiers cachés (.htaccess…) : jamais servis ----------
    location ~ /\. {
        deny all;
    }

    # ---------- Route de santé (utilisée par le HEALTHCHECK Docker) ----------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- Page, styles et scripts : revalidés à chaque visite pour voir les mises à jour ----------
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---------- Icônes et musique : mises en cache une semaine ----------
    location ~* \.(svg|ico|png|jpg|mp3)$ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---------- Toute autre adresse renvoie vers le portfolio ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

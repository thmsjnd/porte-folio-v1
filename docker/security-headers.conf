# En-têtes de sécurité, inclus dans chaque bloc location
# (dans Nginx, un add_header dans un location annule ceux du niveau serveur : on les regroupe ici).
# Le JavaScript et le CSS sont désormais dans des fichiers séparés : plus aucun script ni style en ligne n'est autorisé.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
